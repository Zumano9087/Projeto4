<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Cadastro</title>
    <link rel="stylesheet" href="Css/style.css">
</head>
<body>
    <div class="container">
        <h1>Cadastro de Usuário</h1>
        <p>Crie sua conta para acessar o sistema.</p>

        <form id="formCadastro">
            <input type="text" placeholder="Nome" required>
            
            <input type="email" placeholder="E-mail" required>
            
            <input type="password" id="senha" placeholder="Senha" required>
            
            <div class="campo-senha">
                <input type="password" id="confirmar" placeholder="Confirmar Senha" required>
                <span id="erro-senha" class="erro"></span>
            </div>

            <button type="submit">Cadastrar</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('formCadastro');
        const senha = document.getElementById('senha');
        const confirmar = document.getElementById('confirmar');
        const erroSenha = document.getElementById('erro-senha');

        form.addEventListener('submit', function(event) {   
            event.preventDefault();

            erroSenha.textContent = '';
            confirmar.classList.remove('input-erro')

            if (senha.value !== confirmar.value) {
                erroSenha.textContent = 'As senhas não são iguais!';
                confirmar.classList.add('input-erro');
                confirmar.focus();
                return;
            }
            alert('Cadastro realizado com sucesso!');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
